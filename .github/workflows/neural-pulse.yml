
name: Neural Pulse Brasil - Produção diária

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: read

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Produzir vídeos
        run: python neural_pulse.py

      - name: Salvar vídeos produzidos
        uses: actions/upload-artifact@v4
        with:
          name: neural-pulse-videos
          path: output/
          if-no-files-found: error
          retention-days: 7
